<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo 1 — Buscador de Películas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="emoji e1">🎬</div>
  <div class="emoji e2">🍿</div>
  <div class="emoji e3">🎞️</div>
  <div class="emoji e4">🏆</div>
  <div class="emoji e5">🎥</div>
  <div class="emoji e6">⭐</div>

  <main class="card">
    <h1 class="wiggle">Buscador de pelis 🎬</h1>
    <p>Escribe el título de una película y te contamos quién la dirigió y en qué año se estrenó.</p>

    <form class="signup" id="search-form">
      <input type="text" id="movie-input" placeholder="Ej: The Matrix" aria-label="Título de la película" autocomplete="off">
      <button type="submit">¡Buscar! 🍿</button>
    </form>

    <section class="result" id="result" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
