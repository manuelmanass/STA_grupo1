<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo 1 — ¡Fiesta!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="emoji e1">🎉</div>
  <div class="emoji e2">🌈</div>
  <div class="emoji e3">✨</div>
  <div class="emoji e4">🎈</div>
  <div class="emoji e5">🚀</div>
  <div class="emoji e6">🍕</div>

  <main class="card">
    <h1 class="wiggle">¡Bienvenido a la fiesta! 🥳</h1>
    <p>Aquí no hay reglas, solo colores, confeti y buena vibra. Escribe tu nombre y únete a la celebración.</p>

    <form class="signup" onsubmit="return false;">
      <input type="text" placeholder="¿Cómo te llamas?" aria-label="Nombre">
      <button type="submit">¡Vamos! 🎊</button>
    </form>
  </main>
</body>
</html>
